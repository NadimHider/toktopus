[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toktopus"
version = "1.6.1"
description = "Real-time Terminal Activity and Token Monitor for AI Coding Agents (Antigravity, Claude Code, OpenCode, Cursor, Codex, Pi)"
readme = "README.md"
authors = [{ name = "Nadim Hider" }]
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "rich>=13.0.0",
    "psutil>=5.9.0"
]
keywords = [
    "tui",
    "terminal",
    "ai-agent",
    "tokens",
    "antigravity",
    "claude-code",
    "opencode",
    "cursor",
    "codex",
    "pi",
    "monitoring",
    "benchmarks"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

[project.scripts]
toktopus = "toktopus.cli:main"

[project.urls]
Homepage = "https://github.com/NadimHider/toktopus"
Repository = "https://github.com/NadimHider/toktopus"
Issues = "https://github.com/NadimHider/toktopus/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
toktopus = ["web/*.html"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
